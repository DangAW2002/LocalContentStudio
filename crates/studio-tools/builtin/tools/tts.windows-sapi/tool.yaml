id: tts.windows-sapi
kind: generator
description: "Tổng hợp giọng nói (text-to-speech) qua Windows SAPI sử dụng PowerShell System.Speech"
provides:
  - "tts.synthesize@1"
run:
  type: cli
  command: "powershell"
  args:
    - "-NoProfile"
    - "-ExecutionPolicy"
    - "Bypass"
    - "-Command"
    - "[Console]::InputEncoding = [System.Text.Encoding]::UTF8; [Console]::OutputEncoding = [System.Text.Encoding]::UTF8; $json = [Console]::In.ReadToEnd() | ConvertFrom-Json; $text = if ($json.text) { $json.text } else { 'Xin chào' }; Add-Type -AssemblyName System.Speech; $s = New-Object System.Speech.Synthesis.SpeechSynthesizer; $installed = @($s.GetInstalledVoices() | Where-Object { $_.Enabled }); $available = @($installed | ForEach-Object { $_.VoiceInfo.Name }); $selected = $null; $note = $null; if ($json.voice) { $match = $installed | Where-Object { $_.VoiceInfo.Name -eq $json.voice } | Select-Object -First 1; if ($match) { $selected = $match.VoiceInfo.Name } }; if (-not $selected) { $vi = $installed | Where-Object { $_.VoiceInfo.Culture.Name -like 'vi*' -or $_.VoiceInfo.Name -like '*Vietnamese*' } | Select-Object -First 1; if ($vi) { $selected = $vi.VoiceInfo.Name } else { $selected = if ($installed.Count -gt 0) { $installed[0].VoiceInfo.Name } else { $s.Voice.Name }; $note = 'Không tìm thấy giọng tiếng Việt trong Windows SAPI (các giọng hiện có: ' + ($available -join ', ') + '). Tự động chọn giọng thay thế: ' + $selected + '.' } }; if ($selected) { try { $s.SelectVoice($selected) } catch {} }; $out = if ($json.output_path) { if ([System.IO.Path]::IsPathRooted($json.output_path)) { $json.output_path } else { [System.IO.Path]::Combine((Get-Location).Path, $json.output_path) } } else { [System.IO.Path]::Combine([System.IO.Path]::GetTempPath(), 'sapi-' + [System.Guid]::NewGuid().ToString() + '.wav') }; $dir = [System.IO.Path]::GetDirectoryName($out); if ($dir -and -not (Test-Path $dir)) { [System.IO.Directory]::CreateDirectory($dir) | Out-Null }; $s.SetOutputToWaveFile($out); $s.Speak($text); $s.Dispose(); $res = [PSCustomObject]@{ audio_path = $out; voice = $selected; available_voices = $available; note = $note } | ConvertTo-Json -Compress; if ($env:STUDIO_OUT) { [System.IO.File]::WriteAllText($env:STUDIO_OUT, $res, [System.Text.Encoding]::UTF8) }; Write-Output $res"
needs:
  - "bin:powershell"
cost:
  unit: "character"
  estimate: 0.0
side_effect: none
resources:
  ram_mb: 256
  cpu: light
  gpu_vram_mb: 0
  exclusive: []
lifecycle: per_call
