id: google.veo
kind: generator
description: "Tạo video clip bằng Google Veo qua Gemini API (predictLongRunning)"
provides:
  - "video.generate@1"
run:
  type: builtin
  command: "google.veo"
needs:
  - "secret:GEMINI_API_KEY"
cost:
  unit: "second"
  estimate: 0.20
side_effect: paid
resources:
  ram_mb: 128
  cpu: light
  gpu_vram_mb: 0
  exclusive: []
  rate_key: "provider:google"
lifecycle: per_call
