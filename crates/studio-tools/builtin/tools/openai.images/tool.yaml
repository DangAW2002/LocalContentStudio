id: openai.images
kind: generator
description: "Tạo hình ảnh qua OpenAI Images API (gpt-image-1 / DALL-E)"
provides:
  - "image.generate@1"
run:
  type: builtin
  command: "openai.images"
needs:
  - "secret:OPENAI_API_KEY"
cost:
  unit: "image"
  estimate: 0.04
side_effect: paid
resources:
  ram_mb: 128
  cpu: light
  gpu_vram_mb: 0
  exclusive: []
  rate_key: "provider:openai"
lifecycle: per_call
