[package]
name = "studio-tauri"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
include_dir = "0.7"
sha2 = { workspace = true }
tauri = { version = "2", features = ["protocol-asset"] }
studio-workspace = { path = "../studio-workspace" }
studio-engine = { path = "../studio-engine" }
studio-jobs = { path = "../studio-jobs" }
studio-catalog = { path = "../studio-catalog" }
studio-tools = { path = "../studio-tools" }
studio-brand = { path = "../studio-brand" }
studio-artifacts = { path = "../studio-artifacts" }
studio-mcp = { path = "../studio-mcp" }
studio-web = { path = "../studio-web" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
notify = "6"
url = { workspace = true }
tempfile = { workspace = true }
rfd = "0.15"

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
