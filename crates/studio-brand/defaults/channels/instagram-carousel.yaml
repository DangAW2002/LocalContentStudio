id: "instagram-carousel"
platform: "instagram"
title: "Instagram Carousel"
formats:
  - name: "slide-4-5"
    width: 1080
    height: 1350
    aspect: "4:5"
    safe_zone:
      top: 0.05
      bottom: 0.05
      left: 0.05
      right: 0.05
  - name: "slide-1-1"
    width: 1080
    height: 1080
    aspect: "1:1"
    safe_zone:
      top: 0.05
      bottom: 0.05
      left: 0.05
      right: 0.05
text:
  caption_max: 2200
  hashtags_max: 30
captions_required: false
file:
  containers: ["png", "jpg", "jpeg"]
  max_size_mb: 30
notes: "Tối đa 10 đến 20 slide ảnh/video (cần xác minh với nền tảng theo chính sách cập nhật mới của Meta)."
