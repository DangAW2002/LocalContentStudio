id: "linkedin"
platform: "linkedin"
title: "LinkedIn"
formats:
  - name: "post-square"
    width: 1080
    height: 1080
    aspect: "1:1"
    safe_zone:
      top: 0.05
      bottom: 0.05
      left: 0.05
      right: 0.05
  - name: "post-portrait"
    width: 1080
    height: 1350
    aspect: "4:5"
    safe_zone:
      top: 0.05
      bottom: 0.05
      left: 0.05
      right: 0.05
  - name: "video"
    width: 1920
    height: 1080
    aspect: "16:9"
    fps: 30.0
    max_duration_s: 600.0
    safe_zone:
      top: 0.05
      bottom: 0.05
      left: 0.05
      right: 0.05
text:
  caption_max: 3000
  hashtags_max: 5
captions_required: false
file:
  containers: ["png", "jpg", "jpeg", "mp4", "pdf"]
  max_size_mb: 300
notes: "Cho phép đăng tài liệu PDF (tính năng carousel LinkedIn) và video tối đa 10 phút."
