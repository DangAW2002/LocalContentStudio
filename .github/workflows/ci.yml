name: CI

on:
  push:
    branches:
      - main
      - studio-v2
      - master
  pull_request:
    branches:
      - main
      - studio-v2
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Gate Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            libssl-dev \
            ffmpeg

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: 1. cargo fmt check
        run: cargo fmt --all -- --check

      - name: 2. cargo clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 3. cargo test workspace
        run: cargo test --workspace

      - name: 4. pnpm @studio/design-system build
        run: pnpm --filter @studio/design-system build

      - name: 5. pnpm @studio/desktop-ui typecheck
        run: pnpm --filter @studio/desktop-ui typecheck

      - name: 6. pnpm @studio/desktop-ui test
        run: pnpm --filter @studio/desktop-ui test

      - name: 7. pnpm @studio/desktop-ui build
        run: pnpm --filter @studio/desktop-ui build

      - name: 8. cargo build release (studio-tauri, studio-mcp)
        run: cargo build --release -p studio-tauri -p studio-mcp

  windows:
    name: Gate Windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg on Windows
        run: choco install ffmpeg --no-progress -y

      - name: Run Cargo tests
        run: cargo test --workspace

      - name: Build Design System
        run: pnpm --filter @studio/design-system build

      - name: Typecheck Desktop UI
        run: pnpm --filter @studio/desktop-ui typecheck

      - name: Test Desktop UI
        run: pnpm --filter @studio/desktop-ui test

      - name: Build Desktop UI
        run: pnpm --filter @studio/desktop-ui build
